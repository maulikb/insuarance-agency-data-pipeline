version: 2

sources:
  - name: raw_data
    description: Raw insurance data from various source systems
    database: insurance_db
    schema: raw_data
    
    tables:
      - name: customers
        description: Customer information from CRM system
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: email
            description: Customer email address
            tests:
              - not_null
          - name: created_at
            description: Customer record creation timestamp
            tests:
              - not_null
        
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}
          
        loaded_at_field: created_at

      - name: policies
        description: Insurance policy information from Policy Management System
        columns:
          - name: policy_id
            description: Unique policy identifier
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customers table
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'customers')
                  field: customer_id
          - name: policy_number
            description: Human-readable policy number
            tests:
              - unique
              - not_null
          - name: premium_amount
            description: Annual premium amount
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  min_value: 0
                  inclusive: false
                  
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 12, period: hour}
          
        loaded_at_field: updated_at

      - name: claims
        description: Insurance claims from Claims Management System
        columns:
          - name: claim_id
            description: Unique claim identifier
            tests:
              - unique
              - not_null
          - name: policy_id
            description: Foreign key to policies table
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'policies')
                  field: policy_id
          - name: claim_number
            description: Human-readable claim number
            tests:
              - unique
              - not_null
          - name: incident_date
            description: Date when the incident occurred
            tests:
              - not_null
          - name: reported_date
            description: Date when the claim was reported
            tests:
              - not_null
          - name: claim_amount
            description: Claimed amount
            tests:
              - dbt_utils.accepted_range:
                  min_value: 0
                  inclusive: false
                  
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
          
        loaded_at_field: updated_at

      - name: agents
        description: Insurance agent information from Agent Portal
        columns:
          - name: agent_id
            description: Unique agent identifier
            tests:
              - unique
              - not_null
          - name: employee_id
            description: Employee ID from HR system
            tests:
              - unique
              - not_null
          - name: license_number
            description: Insurance license number
            tests:
              - unique
              - not_null
              
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 3, period: day}
          
        loaded_at_field: updated_at

      - name: payments
        description: Payment transactions from Billing System
        columns:
          - name: payment_id
            description: Unique payment identifier
            tests:
              - unique
              - not_null
          - name: policy_id
            description: Foreign key to policies table
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'policies')
                  field: policy_id
          - name: payment_amount
            description: Payment amount
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  min_value: 0
                  inclusive: false
          - name: payment_date
            description: Date when payment was made
            tests:
              - not_null
              
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
          
        loaded_at_field: created_at

      - name: underwriting_decisions
        description: Underwriting decisions from Underwriting System
        columns:
          - name: decision_id
            description: Unique decision identifier
            tests:
              - unique
              - not_null
          - name: policy_id
            description: Foreign key to policies table
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'policies')
                  field: policy_id
          - name: decision_date
            description: Date of underwriting decision
            tests:
              - not_null
              
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}
          
        loaded_at_field: created_at

      - name: policy_documents
        description: Policy documents from Document Management System
        columns:
          - name: document_id
            description: Unique document identifier
            tests:
              - unique
              - not_null
          - name: policy_id
            description: Foreign key to policies table
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'policies')
                  field: policy_id
          - name: upload_date
            description: Document upload date
            tests:
              - not_null
              
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 3, period: day}
          
        loaded_at_field: created_at