name: 'insurance_dbt'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'insurance_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  insurance_dbt:
    # Config indicated by + and applies to all files under models/...
    +materialized: table
    
    staging:
      +materialized: view
      +schema: staging
      
    marts:
      +materialized: table
      +schema: marts
      
    analytics:
      +materialized: table
      +schema: analytics

# Seeds configuration
seeds:
  insurance_dbt:
    +schema: raw_data

# Snapshots configuration
snapshots:
  insurance_dbt:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: updated_at

# Variables
vars:
  # Default date for incremental models
  execution_date: "{{ ds if ds else '2024-01-01' }}"
  
  # Lookback period for incremental loads (days)
  lookback_days: 7
  
  # Business rule configurations
  high_value_claim_threshold: 25000
  premium_tier_thresholds:
    basic: 1000
    standard: 3000
  
  risk_score_categories:
    low: 3
    medium: 6

# Test configurations
tests:
  +store_failures: true
  +schema: test_failures