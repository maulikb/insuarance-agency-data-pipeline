[core]
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
executor = CeleryExecutor
sql_alchemy_conn = postgresql+psycopg2://insurance_user:insurance_pass@postgres:5432/airflow_db
load_examples = False
dags_are_paused_at_creation = True

[celery]
broker_url = redis://:@redis:6379/0
result_backend = db+postgresql://insurance_user:insurance_pass@postgres:5432/airflow_db

[database]
sql_alchemy_conn = postgresql+psycopg2://insurance_user:insurance_pass@postgres:5432/airflow_db

[webserver]
web_server_host = 0.0.0.0
web_server_port = 8080
base_url = http://localhost:8081

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5 